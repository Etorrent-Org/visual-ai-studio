name: Docker Hub - build and publish

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'src/**'
      - 'web/**'
      - 'README.md'
      - '.dockerignore'
      - '.github/workflows/dockerhub-publish.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'src/**'
      - 'web/**'
      - 'README.md'
      - '.dockerignore'
      - '.github/workflows/dockerhub-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker build (no publication)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: erwanntorrent
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish versioned image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            erwanntorrent/visual-ai-studio-web:latest
            erwanntorrent/visual-ai-studio-web:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
