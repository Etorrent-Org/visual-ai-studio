name: ET Design System - Revue visuelle navigateur

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'tests/visual/**'
      - '.github/workflows/et-visual-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    name: Visual AI Studio - 1440 / 768 / 390
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VISUAL_AI_DATA_DIR: ${{ runner.temp }}/et-visual-isolated-data
      VISUAL_AI_WEB_DIST: ${{ github.workspace }}/web/dist
      ET_TEST_BASE_URL: http://127.0.0.1:8000
      ET_TEST_OUTPUT: artifacts/et-visual
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and Playwright
        run: |
          python -m pip install -e '.[web]' playwright
          python -m playwright install --with-deps chromium
      - name: Build real frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Start isolated backend and check health
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$VISUAL_AI_DATA_DIR"
          python -m uvicorn visual_ai_studio.web_app:app --host 127.0.0.1 --port 8000 > "${RUNNER_TEMP}/et-uvicorn.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/et-uvicorn.pid"
          ready=0
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "${RUNNER_TEMP}/et-uvicorn.log"
            exit 1
          fi
      - name: Capture and test project, brief, admin views
        run: python tests/visual/test_et_interface.py
      - name: Upload screenshots and report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: et-design-system-visual-review-${{ github.run_number }}
          path: |
            artifacts/et-visual/
            ${{ runner.temp }}/et-uvicorn.log
          retention-days: 14
          if-no-files-found: warn
