name: Windows Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Create virtual environment
        shell: pwsh
        run: py -3.11 -m venv .venv

      - name: Install dependencies
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Resolve and validate release version
        id: version
        shell: pwsh
        run: |
          $Version = (& .\.venv\Scripts\python.exe -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ([string]::IsNullOrWhiteSpace($Version)) {
              throw "Unable to resolve project version from pyproject.toml."
          }

          "version=$Version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Project version: $Version"

          if ($env:GITHUB_REF_TYPE -eq "tag") {
              $ExpectedTag = "v$Version"
              if ($env:GITHUB_REF_NAME -ne $ExpectedTag) {
                  throw "Tag $($env:GITHUB_REF_NAME) does not match project version $ExpectedTag."
              }
          }

      - name: Run tests
        shell: pwsh
        run: .\scripts\test.ps1

      - name: Build release package
        shell: pwsh
        run: .\scripts\package-release.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: visual-ai-studio-release
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Visual-AI-Studio-Setup-*.exe
            release/studio-visuel-agent.zip
            release/SHA256SUMS.txt
