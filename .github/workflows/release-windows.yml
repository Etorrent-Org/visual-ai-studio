name: Legacy Windows Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Create virtual environment
        shell: pwsh
        run: py -3.11 -m venv .venv

      - name: Install legacy desktop dependencies
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pip install -e ".[desktop,dev]"

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $Version = (& .\.venv\Scripts\python.exe -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ([string]::IsNullOrWhiteSpace($Version)) {
              throw "Unable to resolve project version from pyproject.toml."
          }
          "version=$Version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run legacy desktop tests
        shell: pwsh
        run: .\scripts\test.ps1

      - name: Build legacy Windows package
        shell: pwsh
        run: .\scripts\package-release.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Upload legacy artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-ai-studio-legacy-windows
          path: release/*
          if-no-files-found: error
