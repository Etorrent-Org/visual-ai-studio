[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "visual-ai-studio"
version = "0.1.0"
description = "Application Windows locale de creation visuelle assistee par intelligence artificielle."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Visual AI Studio" }]
dependencies = [
  "PySide6>=6.7,<7",
  "pydantic>=2.8,<3",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "keyring>=25,<27",
  "platformdirs>=4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-qt>=4.4,<5",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "PyInstaller>=6.11,<7",
]

[project.scripts]
visual-ai-studio = "visual_ai_studio.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/visual_ai_studio"]

[tool.hatch.build.targets.wheel.force-include]
"src/visual_ai_studio/resources" = "visual_ai_studio/resources"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["visual_ai_studio"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["keyring.*", "yaml.*"]
ignore_missing_imports = true

